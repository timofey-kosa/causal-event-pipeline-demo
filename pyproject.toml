[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-methodology-case-study"
version = "0.1.0"
description = "Synthetic methodology case study for causal event-data pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
lightgbm = ["lightgbm>=4.0"]

[project.scripts]
portfolio-case = "portfolio_case.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
