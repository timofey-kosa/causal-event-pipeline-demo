[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-event-pipeline-demo"
version = "0.1.0"
description = "Synthetic methodology demo for causal event-data pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14.0",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.5"]
lightgbm = ["lightgbm>=4.0"]

[project.scripts]
causal-pipeline = "causal_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The report body is long-form prose held in a single f-string per paragraph.
"src/causal_pipeline/reporting.py" = ["E501"]
