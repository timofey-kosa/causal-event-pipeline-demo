<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" width="720" height="346"><style>
svg{--bg:#faf8f4;--ink:#24221f;--ink2:#6d675e;--ink3:#8d867b;--rule:#e2dbcf;--accent:#9a5a24;--cost:#8a7f6d;--c1:#9a5a24;--c2:#215f9e;
 font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#161513;--ink:#e6e1d8;--ink2:#a09a94;--ink3:#857e73;--rule:#33302b;--accent:#cf8a4e;--c1:#c4803f;--c2:#4b9ad4}}
.bgr{fill:var(--bg)}
.g{stroke:var(--rule);stroke-width:1}.zero{stroke:var(--ink3);stroke-width:1}
.ev{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.l0{fill:none;stroke:var(--ink3);stroke-width:1.6}.l1{fill:none;stroke:var(--c1);stroke-width:2}
.l2{fill:none;stroke:var(--c2);stroke-width:2}.l3{fill:none;stroke:var(--ink2);stroke-width:1.8}
.dash{stroke-dasharray:5 4}.band1{fill:var(--c1);opacity:.15;stroke:none}
.d0{fill:var(--ink3);stroke:var(--bg);stroke-width:1.5}.d1{fill:var(--c1);stroke:var(--bg);stroke-width:1.5}
.d2{fill:var(--c2);stroke:var(--bg);stroke-width:1.5}.d3{fill:var(--ink2);stroke:var(--bg);stroke-width:1.5}
.tk{fill:var(--ink3);font-family:ui-monospace,Consolas,monospace;font-size:11px}
.axl{fill:var(--ink2);font-size:11.5px}.dl0,.dl1,.dl2{fill:var(--ink);font-size:11.5px}
.lg{fill:var(--ink2);font-size:11px}
</style><rect class="bgr" width="720" height="346"/><title>The breach is where the move ends</title><desc>Mean mid price relative to the mid at the breach, from 10 s before to 30 s after, on a signed square-root time axis, with the filled resting bid and the taker's entry ask marked.</desc><line class="g" x1="56" y1="272.0" x2="700" y2="272.0"/><text class="tk" x="48" y="275.5" text-anchor="end">−6</text><line class="g" x1="56" y1="222.8" x2="700" y2="222.8"/><text class="tk" x="48" y="226.3" text-anchor="end">−4</text><line class="g" x1="56" y1="173.6" x2="700" y2="173.6"/><text class="tk" x="48" y="177.1" text-anchor="end">−2</text><line class="zero" x1="56" y1="124.4" x2="700" y2="124.4"/><text class="tk" x="48" y="127.9" text-anchor="end">0</text><line class="g" x1="56" y1="75.2" x2="700" y2="75.2"/><text class="tk" x="48" y="78.7" text-anchor="end">+2</text><line class="g" x1="56" y1="26.0" x2="700" y2="26.0"/><text class="tk" x="48" y="29.5" text-anchor="end">+4</text><text class="tk" x="56.0" y="288" text-anchor="middle">−10 s</text><text class="tk" x="125.0" y="288" text-anchor="middle">−5 s</text><text class="tk" x="217.2" y="288" text-anchor="middle">−1 s</text><text class="tk" x="291.7" y="288" text-anchor="middle">0 s</text><text class="tk" x="366.3" y="288" text-anchor="middle">+1 s</text><text class="tk" x="420.8" y="288" text-anchor="middle">+3 s</text><text class="tk" x="527.4" y="288" text-anchor="middle">+10 s</text><text class="tk" x="700.0" y="288" text-anchor="middle">+30 s</text><line class="ev" x1="291.7" y1="26" x2="291.7" y2="272"/><text class="dl0" x="297.7" y="36">breach</text><polyline class="l1" points="56.0,239.5 125.0,238.1 186.3,231.3 217.2,212.6 291.7,124.4 366.3,73.9 420.8,68.5 527.4,66.6 625.1,70.0 699.7,72.7"/><circle class="d1" cx="56.0" cy="239.5" r="3"><title>−10.00 s: −4.68 bp</title></circle><circle class="d1" cx="125.0" cy="238.1" r="3"><title>−5.00 s: −4.62 bp</title></circle><circle class="d1" cx="186.3" cy="231.3" r="3"><title>−2.00 s: −4.34 bp</title></circle><circle class="d1" cx="217.2" cy="212.6" r="3"><title>−1.00 s: −3.58 bp</title></circle><circle class="d1" cx="291.7" cy="124.4" r="3"><title>0 s: 0 bp</title></circle><circle class="d1" cx="366.3" cy="73.9" r="3"><title>+1.00 s: +2.05 bp</title></circle><circle class="d1" cx="420.8" cy="68.5" r="3"><title>+3.00 s: +2.27 bp</title></circle><circle class="d1" cx="527.4" cy="66.6" r="3"><title>+10.00 s: +2.35 bp</title></circle><circle class="d1" cx="625.1" cy="70.0" r="3"><title>+20.00 s: +2.21 bp</title></circle><circle class="d1" cx="699.7" cy="72.7" r="3"><title>+29.95 s: +2.10 bp</title></circle><circle class="d2" cx="56.0" cy="188.2" r="4.5"><title>bid resting 10 s ahead, filled: −2.60 bp</title></circle><text class="dl0" x="65.0" y="204.2">filled bid, 10 s ahead: −2.60</text><circle class="d0" cx="315.3" cy="80.1" r="4.5"><title>taker ask at entry: +1.80 bp</title></circle><text class="dl0" x="324.3" y="98.1">taker ask after the breach: +1.80</text><text class="axl" x="60" y="14">bp from the mid at the breach</text><text class="axl" x="378" y="312" text-anchor="middle">time from the breach (signed square-root axis)</text><line class="l1 " x1="56" y1="333" x2="72" y2="333"/><text class="lg" x="78" y="337">mean mid</text><circle class="d2" cx="155" cy="333" r="4.5"/><text class="lg" x="170" y="337">resting bid, filled</text><circle class="d0" cx="314" cy="333" r="4.5"/><text class="lg" x="329" y="337">taker entry</text></svg>
