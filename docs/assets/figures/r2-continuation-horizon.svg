<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" width="720" height="346"><style>
svg{--bg:#faf8f4;--ink:#24221f;--ink2:#6d675e;--ink3:#8d867b;--rule:#e2dbcf;--accent:#9a5a24;--cost:#8a7f6d;--c1:#9a5a24;--c2:#215f9e;
 font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#161513;--ink:#e6e1d8;--ink2:#a09a94;--ink3:#857e73;--rule:#33302b;--accent:#cf8a4e;--c1:#c4803f;--c2:#4b9ad4}}
.bgr{fill:var(--bg)}
.g{stroke:var(--rule);stroke-width:1}.zero{stroke:var(--ink3);stroke-width:1}
.ev{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3}
.l0{fill:none;stroke:var(--ink3);stroke-width:1.6}.l1{fill:none;stroke:var(--c1);stroke-width:2}
.l2{fill:none;stroke:var(--c2);stroke-width:2}.l3{fill:none;stroke:var(--ink2);stroke-width:1.8}
.dash{stroke-dasharray:5 4}.band1{fill:var(--c1);opacity:.15;stroke:none}
.d0{fill:var(--ink3);stroke:var(--bg);stroke-width:1.5}.d1{fill:var(--c1);stroke:var(--bg);stroke-width:1.5}
.d2{fill:var(--c2);stroke:var(--bg);stroke-width:1.5}.d3{fill:var(--ink2);stroke:var(--bg);stroke-width:1.5}
.tk{fill:var(--ink3);font-family:ui-monospace,Consolas,monospace;font-size:11px}
.axl{fill:var(--ink2);font-size:11.5px}.dl0,.dl1,.dl2{fill:var(--ink);font-size:11.5px}
.lg{fill:var(--ink2);font-size:11px}
